version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vue:
        patterns:
          - vue
          - '@vitejs/plugin-vue'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
